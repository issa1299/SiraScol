{% extends "base.html" %}
{% block title %}Ajouter un créneau{% endblock %}
{% block content %}
<div class="mb-6">
    <a href="{% url 'timetable:home' %}?classroom={{ classroom.pk }}" class="text-sm text-slate-500 hover:text-blue-600">
        <i class="fas fa-arrow-left"></i> Retour
    </a>
</div>
<div class="max-w-md">
    <h1 class="text-2xl font-bold text-slate-800 mb-2">Ajouter un créneau</h1>
    <p class="text-sm text-slate-500 mb-6">Classe : <strong>{{ classroom.name }}</strong></p>
    <form method="post" class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Jour *</label>
            <select name="day" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                {% for d, label in days %}
                <option value="{{ d }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Créneau *</label>
            <select name="time_slot" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                {% for s in slots %}
                <option value="{{ s.id }}">{{ s.name }} ({{ s.start_time|time:"H:i" }}–{{ s.end_time|time:"H:i" }})</option>
                {% empty %}
                <option value="">Aucun créneau — crée-les dans l'admin</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Matière *</label>
            <select name="subject" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                {% for s in subjects %}
                <option value="{{ s.id }}">{{ s.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Enseignant</label>
            <select name="teacher" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm search-person" data-search-person="1" data-placeholder="Rechercher un enseignant…">
                <option value="">—</option>
                {% for t in teachers %}
                <option value="{{ t.id }}">{{ t }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Salle</label>
            <select name="room" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                <option value="">—</option>
                {% for r in rooms %}
                <option value="{{ r.id }}">{{ r.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium">
            <i class="fas fa-save"></i> Enregistrer
        </button>
    </form>
</div>
{% endblock %}
