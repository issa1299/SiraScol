<style>.form-input{width:100%;border:1px solid #d1d5db;border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem}</style>
<form method="post" action="{% url 'attendance:create' %}" class="space-y-3">
  {% csrf_token %}
  <div>
    <label class="text-xs font-medium">Élève *</label>
    <select name="student" required class="form-input search-person" data-search-person="1" data-placeholder="Rechercher un élève…">
      <option value="">— Choisir —</option>
      {% for s in students %}
      <option value="{{ s.id }}">{{ s.last_name }} {{ s.first_name }} ({{ s.matricule }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="text-xs font-medium">Date *</label>
      <input type="date" name="date" value="{{ today }}" required class="form-input">
    </div>
    <div>
      <label class="text-xs font-medium">Type</label>
      <select name="type" class="form-input">
        {% for v,l in type_choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <div>
    <label class="text-xs font-medium">Statut</label>
    <select name="status" class="form-input">
      {% for v,l in status_choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label class="text-xs font-medium">Classe (optionnel)</label>
    <select name="classroom" class="form-input">
      <option value="">— Auto —</option>
      {% for c in classrooms %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label class="text-xs font-medium">Motif</label>
    <textarea name="reason" rows="2" class="form-input"></textarea>
  </div>
  <div class="form-actions flex gap-2 pt-2 border-t">
    <button type="submit" class="flex-1 bg-blue-600 text-white py-2.5 rounded-lg text-sm font-medium">Enregistrer</button>
    <button type="button" onclick="closeModal('modal-dynamic')" class="px-4 text-sm">Annuler</button>
  </div>
</form>
