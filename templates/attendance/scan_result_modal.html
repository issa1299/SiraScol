<div class="space-y-4">
  <div id="scan-result-status" class="rounded-xl px-4 py-3 text-center text-sm font-bold"></div>

  <div class="flex items-center gap-4">
    <div class="w-20 h-20 rounded-2xl overflow-hidden bg-slate-100 border-2 border-slate-200 shrink-0">
      <img id="scan-result-photo" src="" alt="" class="w-full h-full object-cover hidden">
      <div id="scan-result-photo-ph" class="w-full h-full flex items-center justify-center text-3xl text-slate-300">
        <i class="fas fa-user"></i>
      </div>
    </div>
    <div class="min-w-0">
      <p id="scan-result-name" class="text-lg font-bold text-slate-900 truncate"></p>
      <p id="scan-result-role" class="text-xs text-slate-500"></p>
      <p id="scan-result-code" class="text-xs font-mono text-blue-700 mt-1"></p>
    </div>
  </div>

  <div class="grid grid-cols-3 gap-2 text-center text-xs">
    <div class="bg-slate-50 rounded-xl p-3">
      <p class="text-slate-400 uppercase font-bold text-[10px]">Téléphone</p>
      <p id="scan-result-phone" class="font-semibold text-slate-800 mt-1"></p>
    </div>
    <div class="bg-slate-50 rounded-xl p-3">
      <p class="text-slate-400 uppercase font-bold text-[10px]">Type</p>
      <p id="scan-result-type" class="font-semibold text-slate-800 mt-1"></p>
    </div>
    <div class="bg-slate-50 rounded-xl p-3">
      <p class="text-slate-400 uppercase font-bold text-[10px]">Heure</p>
      <p id="scan-result-time" class="font-semibold text-slate-800 mt-1 font-mono"></p>
    </div>
  </div>

  <div class="flex gap-2 pt-2">
    <button type="button" onclick="closeModal('modal-dynamic')"
            class="flex-1 bg-emerald-600 text-white py-3 rounded-xl text-sm font-semibold">
      <i class="fas fa-check"></i> Nouveau scan
    </button>
    <button type="button" id="scan-result-fiche"
            class="px-4 border border-slate-200 text-slate-700 py-3 rounded-xl text-sm font-semibold">
      <i class="fas fa-id-card"></i> Fiche
    </button>
  </div>
</div>
