<form method="post" action="{{ form_action }}" enctype="multipart/form-data" id="teacher-form-modal" class="space-y-3 pb-4">
  {% csrf_token %}
  <input type="hidden" name="with_account" value="0">

  <div class="rounded-xl border border-slate-200 bg-slate-50 px-4 py-3">
    <p class="text-sm font-bold text-slate-800"><i class="fas fa-id-badge"></i> Ajout sans compte de connexion</p>
    <p class="text-[11px] text-slate-600 mt-1 leading-relaxed">
      La fiche du personnel est enregistrée sans identifiant ni mot de passe.
      Un compte pourra être créé plus tard depuis la fiche du membre.
    </p>
  </div>

  {% include "teachers/_teacher_fields.html" %}

  <div class="sticky bottom-0 bg-white border-t pt-3 flex gap-2">
    <button type="submit" id="teacher-submit-btn" class="flex-1 bg-slate-700 text-white py-3.5 min-h-[44px] rounded-xl text-sm font-semibold">
      Enregistrer la fiche
    </button>
    <button type="button" onclick="closeModal('modal-dynamic')" class="px-4 border rounded-xl text-sm min-h-[44px] text-slate-600">Annuler</button>
  </div>
</form>
