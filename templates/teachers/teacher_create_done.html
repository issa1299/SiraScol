<div class="text-center py-6 space-y-3">
  <div class="w-14 h-14 mx-auto rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl">
    <i class="fas fa-check"></i>
  </div>
  <p class="font-semibold text-slate-800">{{ teacher.last_name }} {{ teacher.first_name }}</p>
  <p class="text-sm text-slate-600">{{ msg }}</p>
  <div class="flex gap-2 justify-center pt-2">
    <button type="button" onclick="closeModal('modal-dynamic'); location.reload();"
            class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-sm font-semibold">Fermer</button>
    <button type="button" onclick="openModalUrl('{% url 'teachers:assign' teacher.pk %}', 'Affectations')"
            class="border px-4 py-2.5 rounded-xl text-sm">Modifier affectations</button>
  </div>
</div>
