<div class="text-center py-2">
  <p class="text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">
    <i class="fas fa-qrcode text-blue-600"></i> QR de pointage — {{ badge_role|default:'Élève' }}
  </p>
  <img src="{{ qr_url }}" alt="QR {{ code }}" class="mx-auto rounded-xl border border-slate-200 w-48 h-48 object-contain bg-white">
  <p class="text-sm font-semibold mt-3">{{ student.last_name }} {{ student.first_name }}</p>
  <p class="text-xs font-mono text-slate-500">{{ code }}</p>
  <p class="text-[11px] text-slate-400 mt-1">
    Code local — reconnu automatiquement par le scanner des présences.
  </p>
  <div class="flex flex-wrap gap-2 mt-4 justify-center">
    <a href="{{ qr_url_lg }}" target="_blank" download class="bg-blue-600 text-white text-sm px-4 py-2 rounded-xl">
      <i class="fas fa-download"></i> Télécharger
    </a>
    <a href="{% url 'students:card_preview' student.pk %}" class="bg-teal-600 text-white text-sm px-4 py-2 rounded-xl">
      <i class="fas fa-id-card"></i> Voir le badge
    </a>
    <button type="button" onclick="closeModal('modal-dynamic')" class="border text-sm px-4 py-2 rounded-xl">Fermer</button>
  </div>
</div>
