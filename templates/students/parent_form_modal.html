<style>.form-input{width:100%;border:1px solid #d1d5db;border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem;outline:none}.form-input:focus{border-color:#3b82f6}</style>
{% if form.errors %}<div class="bg-red-50 text-red-700 text-sm p-3 rounded-lg mb-3">{{ form.errors }}</div>{% endif %}
<form method="post" action="{{ form_action }}" class="space-y-3">
  {% csrf_token %}
  <div class="grid grid-cols-2 gap-3">
    <div><label class="text-xs font-medium text-slate-600">Nom *</label>{{ form.last_name }}</div>
    <div><label class="text-xs font-medium text-slate-600">Prénom *</label>{{ form.first_name }}</div>
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div><label class="text-xs font-medium text-slate-600">Téléphone *</label>{{ form.phone }}</div>
    <div><label class="text-xs font-medium text-slate-600">Téléphone 2</label>{{ form.phone2 }}</div>
  </div>
  <div><label class="text-xs font-medium text-slate-600">Email</label>{{ form.email }}</div>
  <div><label class="text-xs font-medium text-slate-600">Profession</label>{{ form.profession }}</div>
  <div><label class="text-xs font-medium text-slate-600">Adresse</label>{{ form.address }}</div>
  {% if is_create and students %}
  <hr class="border-gray-100">
  <p class="text-xs font-semibold text-slate-700">Lier à un élève (optionnel)</p>
  <select name="student" class="form-input search-person" data-search-person="1" data-placeholder="Rechercher un élève…">
    <option value="">— Aucun —</option>
    {% for s in students %}
    <option value="{{ s.id }}">{{ s.last_name }} {{ s.first_name }}</option>
    {% endfor %}
  </select>
  <select name="relation" class="form-input">
    {% for v,l in relations %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
  </select>
  {% endif %}
  <div class="flex gap-2 pt-2 border-t border-gray-100">
    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-sm font-medium">Enregistrer</button>
    <button type="button" onclick="closeModal('modal-dynamic')" class="px-4 text-sm text-slate-600">Annuler</button>
  </div>
</form>
