<style>
.form-input { width: 100%; border: 1px solid #d1d5db; border-radius: 0.75rem; padding: 0.6rem 0.75rem; font-size: 0.875rem; }
</style>
<form method="post" action="{{ form_action }}" class="space-y-3">
  {% csrf_token %}
  <input type="hidden" name="next" value="{% url 'core:dashboard' %}">
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="text-xs font-medium text-slate-600">Date *</label>
      <input type="date" name="date" value="{{ today }}" required class="form-input">
    </div>
    <div>
      <label class="text-xs font-medium text-slate-600">Catégorie *</label>
      <select name="category" required class="form-input">
        {% for val, label in categories %}
        <option value="{{ val }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="text-xs font-medium text-slate-600">Montant *</label>
      <input type="number" name="amount" step="1" min="1" required class="form-input" placeholder="0">
    </div>
    <div>
      <label class="text-xs font-medium text-slate-600">Devise</label>
      <select name="currency" class="form-input">
        <option value="FCFA">FCFA</option>
        <option value="CDF">CDF</option>
        <option value="EUR">EUR</option>
      </select>
    </div>
  </div>
  <div>
    <label class="text-xs font-medium text-slate-600">Motif *</label>
    <textarea name="motif" rows="2" required class="form-input" placeholder="Ex: Salaire enseignant mars"></textarea>
  </div>
  <div class="form-actions flex gap-2">
    <button type="submit" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-3 rounded-xl text-sm font-semibold">
      Enregistrer
    </button>
    <button type="button" onclick="closeModal('modal-dynamic')" class="px-4 border rounded-xl text-sm">Annuler</button>
  </div>
</form>
