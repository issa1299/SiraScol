{% extends "base.html" %}
{% block title %}Nouvelle facture - SiraScol{% endblock %}
{% block content %}
<div class="mb-6">
    <a href="{% url 'finance:invoices' %}" class="text-sm text-slate-500 hover:text-blue-600">
        <i class="fas fa-arrow-left"></i> Retour
    </a>
</div>
<div class="max-w-xl">
    <h1 class="text-2xl font-bold text-slate-800 mb-6">Nouvelle facture</h1>
    <form method="post" class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Élève *</label>
            <select name="student" required class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm search-person" data-search-person="1" data-placeholder="Rechercher un élève…">
                <option value="">— Choisir —</option>
                {% for s in students %}
                <option value="{{ s.id }}">{{ s.last_name }} {{ s.first_name }} ({{ s.matricule }})</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Type de frais *</label>
            <select name="fee_type" required class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm">
                <option value="">— Choisir —</option>
                {% for f in fee_types %}
                <option value="{{ f.id }}">{{ f.name }} ({{ f.default_amount }})</option>
                {% empty %}
                <option value="" disabled>Crée d'abord un type de frais dans l'admin</option>
                {% endfor %}
            </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Année scolaire *</label>
                <select name="academic_year" required class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm">
                    {% for y in years %}
                    <option value="{{ y.id }}" {% if current_year and y.id == current_year.id %}selected{% endif %}>{{ y.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Montant *</label>
                <input type="number" name="amount" step="0.01" min="0" required class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Date d'échéance *</label>
            <input type="date" name="due_date" value="{{ today }}" required class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
            <textarea name="description" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm"></textarea>
        </div>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium">
            <i class="fas fa-save"></i> Créer la facture
        </button>
    </form>
</div>
{% endblock %}
