<style>.form-input{width:100%;border:1px solid #d1d5db;border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem}</style>
{% if form.errors %}<div class="bg-red-50 text-red-700 text-sm p-3 rounded-lg mb-3">{{ form.errors }}</div>{% endif %}
<form method="post" action="{{ form_action }}" class="space-y-3">
  {% csrf_token %}
  <div><label class="text-xs font-medium">Titre *</label>{{ form.title }}</div>
  <div><label class="text-xs font-medium">Contenu *</label>{{ form.content }}</div>
  <div><label class="text-xs font-medium">Destinataires</label>{{ form.target }}</div>
  <div class="grid grid-cols-2 gap-2">
    <div><label class="text-xs font-medium">Classe</label>{{ form.classroom }}</div>
    <div><label class="text-xs font-medium">Niveau</label>{{ form.level }}</div>
  </div>
  <div><label class="text-xs font-medium">Expire le</label>{{ form.expires_at }}</div>
  <label class="text-sm flex items-center gap-2">{{ form.is_published }} Publiée</label>
  <div class="form-actions flex gap-2">
    <button type="submit" class="flex-1 bg-blue-600 text-white py-2.5 rounded-lg text-sm font-medium">Enregistrer</button>
    <button type="button" onclick="closeModal('modal-dynamic')" class="px-4 text-sm">Annuler</button>
  </div>
</form>
