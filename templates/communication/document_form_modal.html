<form method="post" action="{{ form_action }}" enctype="multipart/form-data" id="doc-upload-form" class="space-y-3 pb-4">
  {% csrf_token %}
  {% if form.errors %}
  <div class="bg-red-50 text-red-700 text-xs rounded-lg p-2">
    {% for field, errs in form.errors.items %}
    <p>{{ field }} : {{ errs|join:", " }}</p>
    {% endfor %}
  </div>
  {% endif %}
  {% for field in form %}
  <div>
    <label class="text-xs text-slate-500">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
    {{ field }}
  </div>
  {% endfor %}
  <div class="sticky bottom-0 bg-white border-t pt-3 flex gap-2">
    <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-xl text-sm font-semibold">Enregistrer</button>
    <button type="button" onclick="closeModal('modal-dynamic')" class="px-4 border rounded-xl text-sm">Annuler</button>
  </div>
</form>
<script>
(function(){
  var form = document.getElementById('doc-upload-form');
  if (!form) return;
  form.addEventListener('submit', function(e) {
    var body = document.getElementById('modal-dynamic-body');
    if (!body || !body.contains(form)) return;
    e.preventDefault();
    body.innerHTML = '<p class="text-center py-8 text-slate-500"><i class="fas fa-spinner fa-spin"></i> Envoi…</p>';
    var fd = new FormData(form);
    function getCookie(n){var m=document.cookie.match('(^|;)\\s*'+n+'\\s*=\\s*([^;]+)');return m?m.pop():'';}
    fetch(form.action, {
      method: 'POST', body: fd,
      headers: { 'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': fd.get('csrfmiddlewaretoken') || getCookie('csrftoken') },
      credentials: 'same-origin'
    }).then(function(r){ return r.text(); }).then(function(html){
      body.innerHTML = html;
      body.querySelectorAll('script').forEach(function(old){
        var s = document.createElement('script'); s.textContent = old.textContent; old.parentNode.replaceChild(s, old);
      });
    }).catch(function(){ body.innerHTML = '<p class="text-red-600 text-sm">Erreur réseau.</p>'; });
  });
})();
</script>
<style>
#doc-upload-form input, #doc-upload-form select, #doc-upload-form textarea {
  width: 100%; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.875rem;
}
</style>
