{# Tableaux → cartes compactes + boîte de dialogue au tap (mobile). #}
<style>
  @media (max-width: 767px) {
    table.mobile-card-table,
    table.mobile-card-table tbody,
    table.mobile-card-table tr,
    table.mobile-card-table td { display: block; width: 100% !important; }

    table.mobile-card-table thead { display: none !important; }

    table.mobile-card-table tbody tr {
      position: relative;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: .9rem;
      margin: 0 0 .55rem;
      padding: .55rem .2rem;
      box-shadow: 0 1px 6px rgba(15, 23, 42, .06);
      cursor: pointer;
      overflow: hidden;
    }

    table.mobile-card-table tbody tr::after {
      content: '\f105';
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      right: .75rem;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: .8rem;
    }

    table.mobile-card-table tbody td {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      border: 0 !important;
      padding: .35rem .85rem !important;
      font-size: .78rem;
      line-height: 1.3;
      text-align: left !important;
      word-break: break-word;
    }

    table.mobile-card-table tbody td:not(.mobile-primary):not(.mobile-card-empty) { display: none !important; }

    table.mobile-card-table tbody td::before {
      content: attr(data-label);
      flex: 0 0 42%;
      max-width: 42%;
      font-size: .6rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: #64748b;
    }

    table.mobile-card-table tbody td.mobile-card-empty::before { display: none !important; content: '' !important; }
    table.mobile-card-table tbody td.mobile-card-empty { justify-content: center !important; text-align: center !important; color: #94a3b8; font-style: italic; cursor: default; }
    table.mobile-card-table tbody tr.mobile-no-dialog { cursor: default; }
    table.mobile-card-table tbody tr.mobile-no-dialog::after { display: none; }

    /* Boîte de dialogue */
    #mobile-row-dialog {
      position: fixed; inset: 0; z-index: 120;
      background: rgba(15,23,42,.55);
      display: none; align-items: flex-end; justify-content: center;
    }
    #mobile-row-dialog.open { display: flex; }
    #mobile-row-dialog .dialog-box {
      width: 100%; max-height: 88vh; overflow-y: auto;
      background: #fff; border-radius: 1.25rem 1.25rem 0 0;
      padding: 1.1rem 1rem 1.5rem;
      box-shadow: 0 -8px 30px rgba(15,23,42,.2);
    }
    #mobile-row-dialog .dialog-box h3 { font-size: 1rem; font-weight: 800; color: #0f172a; margin-bottom: .75rem; padding-right: 2rem; }
    #mobile-row-dialog .dialog-row {
      display: flex; justify-content: space-between; gap: .75rem;
      padding: .55rem 0; border-bottom: 1px dashed #e2e8f0; font-size: .8rem;
    }
    #mobile-row-dialog .dialog-row span:first-child { flex: 0 0 42%; font-size: .62rem; font-weight: 800; text-transform: uppercase; color: #64748b; }
    #mobile-row-dialog .dialog-row span:last-child { flex: 1; text-align: right; word-break: break-word; color: #1e293b; }
    #mobile-row-dialog .dialog-close {
      position: absolute; right: 1.2rem; top: 1.1rem;
      background: #f1f5f9; border: 0; border-radius: 9999px;
      width: 2rem; height: 2rem; color: #475569; font-size: 1rem;
    }
  }
</style>
<script>
(function () {
  function labelsFor(table) {
    var head = table.querySelector('thead');
    return head ? Array.prototype.map.call(head.querySelectorAll('th'), function (th) { return th.textContent.trim(); }) : [];
  }

  function closeDialog() {
    var d = document.getElementById('mobile-row-dialog');
    if (d) d.classList.remove('open');
  }

  function showDialog(pairs) {
    var d = document.getElementById('mobile-row-dialog');
    if (!d) {
      d = document.createElement('div');
      d.id = 'mobile-row-dialog';
      d.innerHTML = '<div class="dialog-box"><button type="button" class="dialog-close" aria-label="Fermer">&times;</button><h3></h3><div class="dialog-content"></div></div>';
      document.body.appendChild(d);
      d.addEventListener('click', function (e) { if (e.target === d) closeDialog(); });
      d.querySelector('.dialog-close').addEventListener('click', closeDialog);
    }
    var firstValue = pairs.find(function (p) { return p[1]; });
    var title = firstValue ? firstValue[1] : 'Détails';
    d.querySelector('h3').textContent = title;
    var content = d.querySelector('.dialog-content');
    content.innerHTML = '';
    pairs.forEach(function (p) {
      if (!p[0] && !p[1]) return;
      var row = document.createElement('div');
      row.className = 'dialog-row';
      var a = document.createElement('span'); a.textContent = p[0] || '';
      var b = document.createElement('span'); b.textContent = p[1] || '—';
      row.appendChild(a); row.appendChild(b); content.appendChild(row);
    });
    d.classList.add('open');
  }

  function transformTables() {
    document.querySelectorAll('table:not([data-mobile-cards])').forEach(function (table) {
      var body = table.tBodies && table.tBodies[0];
      if (!body || !body.rows.length) return;
      var labels = labelsFor(table);
      Array.prototype.forEach.call(body.rows, function (tr) {
        var hasField = tr.querySelector('input, select, textarea, button');
        if (hasField) tr.classList.add('mobile-no-dialog');
        var pairs = [];
        var primary = 0;
        Array.prototype.forEach.call(tr.cells, function (td, i) {
          if (td.colSpan > 1) {
            td.classList.add('mobile-card-empty');
            return;
          }
          if (!td.getAttribute('data-label') && labels[i]) td.setAttribute('data-label', labels[i]);
          var text = td.textContent.trim();
          var field = td.querySelector('input, select, textarea, button');
          pairs.push([td.getAttribute('data-label') || '', text || (field ? '…' : '')]);
          // Les cellules contenant un champ doivent TOUJOURS rester visibles,
          // sinon la saisie (notes, validation, pointage) devient impossible sur mobile.
          if (field || (primary < 2 && text && !td.querySelector('img'))) {
            td.classList.add('mobile-primary');
            if (!field) primary++;
          }
        });
        if (!tr.classList.contains('mobile-no-dialog') && !tr.classList.contains('mobile-card-empty')) {
          tr.addEventListener('click', function (e) {
            if (e.target.closest('a, button, input, select, textarea')) return;
            showDialog(pairs);
          });
        }
      });
      table.classList.add('mobile-card-table');
      table.setAttribute('data-mobile-cards', '1');
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', transformTables);
  else transformTables();
  window.addEventListener('resize', transformTables);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDialog(); });
})();
</script>
