<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — SiraScol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-lg border p-8 text-center">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-slate-100 text-slate-500 flex items-center justify-center text-2xl mb-4">
      <i class="fas fa-map-signs"></i>
    </div>
    <p class="text-5xl font-black text-slate-200 mb-2">404</p>
    <h1 class="text-xl font-bold text-slate-800 mb-2">Page introuvable</h1>
    <p class="text-sm text-slate-500 mb-6">
      Cette adresse n’existe pas ou a été déplacée.
      Vérifiez l’URL ou revenez à l’accueil.
    </p>
    <div class="flex flex-col sm:flex-row gap-2 justify-center">
      <a href="/" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-2.5 rounded-xl">
        Accueil
      </a>
      <a href="javascript:history.back()" class="border text-slate-600 text-sm font-medium px-5 py-2.5 rounded-xl hover:bg-slate-50">
        Retour
      </a>
    </div>
  </div>
</body>
</html>
