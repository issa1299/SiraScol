{% extends "base.html" %}
{% block title %}Matières{% endblock %}
{% block content %}
<div class="mb-4">
  <a href="{% url 'core:config_home' %}" class="text-sm text-slate-500"><i class="fas fa-arrow-left"></i> Configuration</a>
  <h1 class="text-xl font-bold text-slate-800 mt-1">Matières</h1>
</div>

<form method="post" action="{% url 'core:config_subject_save' %}" class="bg-white rounded-2xl border p-4 mb-4 space-y-2">
  {% csrf_token %}
  <input name="name" placeholder="Nom (ex: Mathématiques)" required class="w-full border rounded-xl px-3 py-2.5 text-sm">
  <div class="grid grid-cols-2 gap-2">
    <input name="code" placeholder="Code (ex: MATH)" required class="border rounded-xl px-3 py-2.5 text-sm">
    <input name="coefficient" type="number" step="0.5" value="1" placeholder="Coef" class="border rounded-xl px-3 py-2.5 text-sm">
  </div>
  <button class="w-full bg-blue-600 text-white py-2.5 rounded-xl text-sm">Ajouter</button>
</form>
<div class="space-y-2">
{% for s in subjects %}
<div class="bg-white rounded-xl border p-3 flex justify-between">
  <div><p class="font-semibold">{{ s.name }}</p><p class="text-xs text-slate-400">{{ s.code }} · coef {{ s.coefficient }}</p></div>
  <form method="post" action="{% url 'core:config_subject_delete' s.pk %}">{% csrf_token %}<button class="text-xs text-red-600">Suppr.</button></form>
</div>
{% empty %}<p class="text-slate-500 text-sm">Aucune matière.</p>{% endfor %}
</div>

{% endblock %}
