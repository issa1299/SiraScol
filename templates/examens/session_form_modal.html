<form method="post" action="{{ form_action }}" class="space-y-3 pb-3">
  {% csrf_token %}
  {% if form.errors %}<div class="rounded-xl bg-rose-50 border border-rose-200 p-3 text-xs text-rose-700">{{ form.errors }}</div>{% endif %}
  <div class="grid grid-cols-2 gap-3">
    <div><label class="block text-xs text-slate-500 mb-1">Examen *</label>{{ form.type }}</div>
    <div><label class="block text-xs text-slate-500 mb-1">Année scolaire *</label>{{ form.academic_year }}</div>
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div><label class="block text-xs text-slate-500 mb-1">Type de session</label>{{ form.kind }}</div>
    <div><label class="block text-xs text-slate-500 mb-1">Statut</label>{{ form.status }}</div>
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div><label class="block text-xs text-slate-500 mb-1">Date de début *</label>{{ form.start_date }}</div>
    <div><label class="block text-xs text-slate-500 mb-1">Date de fin *</label>{{ form.end_date }}</div>
  </div>
  <div><label class="block text-xs text-slate-500 mb-1">Académie</label>{{ form.academy }}</div>
  <div><label class="block text-xs text-slate-500 mb-1">Centre d'examen</label>{{ form.center }}</div>
  <div class="flex gap-2 pt-2 sticky bottom-0 bg-white border-t">
    <button type="submit" class="flex-1 bg-blue-600 text-white py-3 min-h-[44px] rounded-xl text-sm font-semibold">Enregistrer</button>
    <button type="button" onclick="closeModal('modal-dynamic')" class="px-4 border rounded-xl text-sm min-h-[44px]">Annuler</button>
  </div>
</form>
