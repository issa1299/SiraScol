<form method="post" action="{{ form_action }}" enctype="multipart/form-data" class="space-y-3 pb-3">
  {% csrf_token %}
  {% if form.errors %}<div class="rounded-xl bg-rose-50 border border-rose-200 p-3 text-xs text-rose-700">{{ form.errors }}</div>{% endif %}
  {% include "examens/_candidate_fields.html" %}
  <div class="flex gap-2 pt-3 sticky bottom-0 bg-white border-t">
    <button type="submit" class="flex-1 bg-blue-600 text-white py-3 min-h-[44px] rounded-xl text-sm font-semibold">Inscrire</button>
    <button type="button" onclick="closeModal('modal-dynamic')" class="px-4 border rounded-xl text-sm min-h-[44px]">Annuler</button>
  </div>
</form>
