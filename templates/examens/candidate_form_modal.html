<form method="post" action="{{ form_action }}" class="space-y-3 pb-3">
  {% csrf_token %}
  <div><label class="block text-xs text-slate-500 mb-1">Session d'examen *</label>
    <select name="session" class="form-input" required>{% for s in sessions %}<option value="{{ s.pk }}">{{ s.get_type_display }} — {{ s.academic_year.name }}</option>{% endfor %}</select></div>
  <div><label class="block text-xs text-slate-500 mb-1">Élève *</label>
    <select name="student" class="form-input" required><option value="">— Choisir un élève —</option>
      {% for s in students %}<option value="{{ s.pk }}">{{ s.last_name|title }} {{ s.first_name|title }} — {{ s.matricule }}</option>{% endfor %}</select></div>
  <div class="grid grid-cols-2 gap-3">
    <div><label class="block text-xs text-slate-500 mb-1">Classe</label>
      <select name="classroom" class="form-input"><option value="">—</option>{% for c in classrooms %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div>
    <div><label class="block text-xs text-slate-500 mb-1">Série</label>
      <select name="series" class="form-input">{% for v, l in series %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div>
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div><label class="block text-xs text-slate-500 mb-1">Frais d'examen</label><input type="number" name="exam_fee" value="0" min="0" step="1" class="form-input"></div>
    <div><label class="block text-xs text-slate-500 mb-1">Notes</label><input type="text" name="notes" class="form-input"></div>
  </div>
  <div class="flex gap-2 pt-2 sticky bottom-0 bg-white border-t">
    <button type="submit" class="flex-1 bg-blue-600 text-white py-3 min-h-[44px] rounded-xl text-sm font-semibold">Inscrire</button>
    <button type="button" onclick="closeModal('modal-dynamic')" class="px-4 border rounded-xl text-sm min-h-[44px]">Annuler</button>
  </div>
</form>
